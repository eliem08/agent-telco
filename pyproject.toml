[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-telco"
version = "0.1.0"
description = "Twilio for agents: phone numbers and texting for agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-telco = "agent_telco.__main__:main"

[tool.setuptools]
packages = ["agent_telco"]
